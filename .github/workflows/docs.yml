name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build the TS packages first so TypeDoc can resolve the cross-package
      # `@cl-mcp/*` type imports from each package's compiled dist.
      - name: Build packages
        run: npm run build

      - name: Build docs site
        run: npm run build -w packages/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
